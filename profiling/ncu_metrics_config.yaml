# Metrics collected by scripts/profile_ncu.sh (read by profiling/ncu_targets.py --print-metrics).
# Names were checked against `ncu --query-metrics --chip ad102` (Nsight Compute 2023.1).
metrics:
  timing:
    - gpu__time_duration.sum
  launch:
    - launch__grid_size
    - launch__block_size
    - launch__registers_per_thread
    - launch__occupancy_limit_registers
    - launch__occupancy_limit_warps
    - launch__occupancy_limit_blocks
    - sm__maximum_warps_per_active_cycle_pct
  occupancy:
    - sm__warps_active.avg.pct_of_peak_sustained_active
  memory:
    - dram__bytes_read.sum
    - dram__bytes_write.sum
    - dram__throughput.avg.pct_of_peak_sustained_elapsed
    - l1tex__t_sector_hit_rate.pct
    - lts__t_sector_hit_rate.pct
    - smsp__sass_average_data_bytes_per_sector_mem_global_op_ld.pct
    - smsp__sass_average_data_bytes_per_sector_mem_global_op_st.pct
    - smsp__sass_average_data_bytes_per_sector_mem_local.pct
  compute:
    - sm__throughput.avg.pct_of_peak_sustained_elapsed
  warp_stalls:  # average warps stalled per issued instruction, by reason
    - smsp__average_warps_issue_stalled_long_scoreboard_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_short_scoreboard_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_lg_throttle_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_mio_throttle_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_math_pipe_throttle_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_wait_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_drain_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_barrier_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_membar_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_branch_resolving_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_dispatch_stall_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_no_instruction_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_imc_miss_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_not_selected_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_misc_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_tex_throttle_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_sleeping_per_issue_active.ratio
    - smsp__average_warps_issue_stalled_selected_per_issue_active.ratio
