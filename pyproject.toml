[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-kernels-edge-vision"
version = "1.1.0"
description = "Triton GPU kernels for batch-1 edge vision pre- and post-processing, with a measured latency study on an RTX 4050 Laptop GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Utkarsh Sengar", email = "cs23bt026@iitdh.ac.in" }]
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "triton>=3.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
# YOLOv8n detection pipeline (Ultralytics is AGPL-3.0; it is only used to load the model).
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/sengarutk/cuda-kernels-edge-vision"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = ["cuda: requires a CUDA GPU (skipped automatically when none is available)"]
